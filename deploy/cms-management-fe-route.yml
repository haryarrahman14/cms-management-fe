---
kind: Template
apiVersion: v1
metadata:
  name: ${APP_NAME}-route
labels:
  template: ${APP_NAME}-route
  app: ${APP_NAME}
objects:
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: ${APP_NAME}
  spec:
    path: /
    to:
      kind: Service
      name: ${APP_NAME}
    port:
      targetPort: 5173
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: None
parameters:
  - name: APP_NAME
  - name: STAGE
  - name: GROUP_NAME

